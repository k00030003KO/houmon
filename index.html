<style>

const TL=new Map();

 $("nok").onclick=()=>{const n=$("nn").value.trim();if(!n){openResults("名前を入力してください。");return}if(S.res.some(r=>r[0]==n)){openResults("同じ名前の結果があります。別の名前にしてください。");return}
  S.res.push([n,$("nc").value,false,nshape=="xx",$("ni").value.trim(),nshape]);nshape="ci";save();draw();openResults("「"+n+"」を追加しました。")};
 $("rmiss").onclick=()=>{if(!miss.length)return;miss.forEach(d=>S.res.push([d[0],d[1],false,d[3]=="xx",d[2],d[3]]));commit(miss.length+"件の標準の結果を戻しました。")};
 $("rrst").onclick=()=>{const b=$("rrst");if(!b.dataset.ok){b.dataset.ok=1;b.textContent="もう一度押すと、標準の結果の色・文字・形が初期に戻ります";return}S.res.forEach(r=>{const d=DEF.find(x=>x[0]==r[0]);if(d){r[1]=d[1];r[4]=d[2];r[5]=d[3];r[3]=(d[3]=="xx");r[2]=false}});commit("標準の結果の見た目を初期に戻しました。")}}
function fbLabel(){const n=filt.flags.length+filt.items.length+filt.res.length;$("fb").textContent="🔍 絞り込み"+(n?"（"+n+"）":"");$("fb").style.background=n?"var(--acc)":"var(--card)";$("fb").style.color=n?"#fff":"var(--fg)"}
function openFilter(){
 let o=`<div class="top"><b>絞り込み</b><button class="x" id="cl">×</button></div><div style="font-size:12px;color:var(--mut)">選んだ条件に合う家だけを地図に出します。フラグと項目は「すべて付いている家」、訪問結果は「最新の結果がどれか」で絞ります。</div>`;
 o+=`<h3>訪問結果（最新の結果）</h3><div class="row">`+S.res.filter(r=>!r[2]).map(r=>`<button class="chip res ${filt.res.includes(r[0])?"on":""}" style="border-left-color:${r[1]}" data-fr="${esc(r[0])}">${esc(r[0])}</button>`).join("")+`</div>`;
 CL().forEach(L=>{const fs=S.flags.filter(f=>f[3]==L.id&&!f[2]),is=L.id=="visit"||L.id=="apt"?[]:S.sv.filter(g=>g.l==L.id&&!g.hid);if(!fs.length&&!is.length)return;o+=`<h3>${esc(L.name)}</h3><div class="row">`+fs.map(f=>`<button class="chip ${filt.flags.includes(f[0])?"on":""}" data-ff="${esc(f[0])}">${f[1]} ${esc(f[0])}</button>`).join("")+is.map(g=>`<button class="chip ${filt.items.includes(g.n)?"on":""}" style="border-left:8px solid ${g.c}" data-fi="${esc(g.n)}">${esc(g.n)}</button>`).join("")+`</div>`});
 o+=`<div class="row" style="margin-top:14px"><button class="chip" id="fclr">条件をすべて解除</button></div>`;
 sheet.innerHTML=o;sheet.style.display="block";
 const tg=(a,v)=>{const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);draw();fbLabel();openFilter()};
 $("cl").onclick=()=>{sheet.style.display="none"};
 sheet.querySelectorAll("[data-fr]").forEach(b=>b.onclick=()=>tg(filt.res,b.dataset.fr));
 sheet.querySelectorAll("[data-ff]").forEach(b=>b.onclick=()=>tg(filt.flags,b.dataset.ff));
 sheet.querySelectorAll("[data-fi]").forEach(b=>b.onclick=()=>tg(filt.items,b.dataset.fi));
 $("fclr").onclick=()=>{filt={flags:[],items:[],res:[]};draw();fbLabel();openFilter()}}
$("fb").onclick=openFilter;fbLabel();
let toastT=null;
function toast(m,ms){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display="none"},ms||8000)}
function locLabel(){$("loc").textContent=follow?(me?"📍 追従中":"📍 取得中…"):"📍 現在地";$("loc").style.background=follow?"var(--acc)":"var(--card)";$("loc").style.color=follow?"#fff":"var(--fg)"}
function locate(){
 if(!navigator.geolocation){toast("この端末（またはこのページ）では、位置情報が使えません。");return}
 follow=true;locLabel();toast("現在地を取得しています…（位置情報の許可を求められたら「許可」を選んでください）",5000);
 if(me){c={...me};draw()}
 if(watchId!==null)return;
 try{watchId=navigator.geolocation.watchPosition(p=>{const first=!me;me={lat:p.coords.latitude,lng:p.coords.longitude};acc=p.coords.accuracy||0;if(follow)c={...me};if(first)$("toast").style.display="none";locLabel();draw()},e=>{
  if(e&&e.code==3){toast("位置がまだ取れていません。屋外や窓の近くで、もう少しお待ちください。",6000);return}
  watchId=null;follow=false;locLabel();
  toast(e&&e.code==1?"位置情報が許可されていません。ブラウザのアドレスバー付近、または設定の「サイトの権限」から、位置情報を許可してください。このページ（Claudeアプリ内など）では許可が出せない場合があります。":"現在地を取得できませんでした。端末の位置情報（GPS）がオンか確認してください。",14000)
 },{enableHighAccuracy:true,maximumAge:2000,timeout:15000})}catch(err){watchId=null;follow=false;locLabel();toast("このページでは位置情報を使えない設定のようです。",10000)}}
const zoom=f=>{sc=Math.max(0.04,Math.min(12,sc*f));draw()};
$("zi").onclick=()=>zoom(1.6);$("zo").onclick=()=>zoom(1/1.6);
map.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?1.25:0.8)},{passive:false});
$("off").onclick=()=>{if(me){c={...me};follow=true;locLabel();draw()}};
$("loc").onclick=locate;if(S.houses.length)c={lat:S.houses[0].lat,lng:S.houses[0].lng};
const urGo=d=>{const k=HI+d;if(k<0||k>=HS.length)return;HI=k;S=JSON.parse(HS[HI]);try{localStorage.setItem("houmon",HS[HI])}catch(e){}sheet.style.display="none";sel=null;roomSel=null;renderHd();draw();urUp();toast(d<0?"1つ前に戻しました":"1つ先に進みました",1500)};
$("ur").onclick=()=>urGo(-1);$("rd2").onclick=()=>urGo(1);
HS=[JSON.stringify(S)];HI=0;urUp();
var hpush=false,hskip=0;
function syncBack(){try{const o=sheet.style.display=="block"||ddOpen;if(o&&!hpush){history.pushState({o:1},"");hpush=true}else if(!o&&hpush){hpush=false;hskip++;history.back()}}catch(e){}}
if(typeof MutationObserver!="undefined")new MutationObserver(syncBack).observe(sheet,{attributes:true,attributeFilter:["style"]});
addEventListener("popstate",()=>{if(hskip>0){hskip--;return}hpush=false;
 if(sheet.style.display=="block"){if(roomSel&&sel){roomSel=null;open()}else if($("cl"))$("cl").click();else{sheet.style.display="none";sel=null;draw()}}
 if(ddOpen){ddOpen=false;renderHd()}
 syncBack()});
addEventListener("resize",draw);draw();
</script></body></html>
