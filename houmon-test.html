$("zi").onclick=()=>zoom(1.6);$("zo").onclick=()=>zoom(1/1.6);
map.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?1.25:0.8)},{passive:false});
$("cmp").onclick=()=>{S.hm=S.hm=="h"?"n":"h";try{localStorage.setItem("houmon_test",JSON.stringify(S))}catch(e){}draw();toast(S.hm=="h"?"「進行方向が上」にしました。現在地を追いかけている間、進む向きが上になります。":"「北が上」に固定しました。",3500)};
$("off").onclick=()=>{if(me){c={...me};follow=true;locLabel();draw()}};
$("loc").onclick=locate;if(S.houses.length)c={lat:S.houses[0].lat,lng:S.houses[0].lng};
const urGo=d=>{const k=HI+d;if(k<0||k>=HS.length)return;HI=k;S=JSON.parse(HS[HI]);try{localStorage.setItem("houmon_test",HS[HI])}catch(e){}sheet.style.display="none";sel=null;roomSel=null;renderHd();draw();urUp();toast(d<0?"1つ前に戻しました":"1つ先に進みました",1500)};
$("ur").onclick=()=>urGo(-1);$("rd2").onclick=()=>urGo(1);
HS=[JSON.stringify(S)];HI=0;urUp();
var hpush=false,hskip=0;
function syncBack(){try{map.classList.toggle("so",sheet.style.display=="block");const o=sheet.style.display=="block"||ddOpen;if(o&&!hpush){history.pushState({o:1},"");hpush=true}else if(!o&&hpush){hpush=false;hskip++;history.back()}}catch(e){}}
if(typeof MutationObserver!="undefined")new MutationObserver(syncBack).observe(sheet,{attributes:true,attributeFilter:["style"]});
addEventListener("popstate",()=>{if(hskip>0){hskip--;return}hpush=false;
 if(sheet.style.display=="block"){if(roomSel&&sel){roomSel=null;open()}else if($("cl"))$("cl").click();else{sheet.style.display="none";sel=null;draw()}}
 if(ddOpen){ddOpen=false;renderHd()}
 syncBack()});
addEventListener("resize",draw);draw();

/* ===== 負荷テスト用（本番アプリには入れない） ===== */
(function(){const bar=document.createElement("div");bar.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99;background:#7c2d12;color:#fff;font-size:12px;padding:4px 6px;display:flex;gap:4px;flex-wrap:wrap;align-items:center";
bar.innerHTML='<b>🧪テスト版</b><span id="tms">描画 - ms</span>'+[100,300,500,1000,2000].map(n=>'<button data-n="'+n+'" style="padding:3px 7px">'+n+'件</button>').join("")+'<button data-n="0" style="padding:3px 7px">全部消す</button>';
document.body.appendChild(bar);
const od=draw;draw=function(){const t=performance.now();od();const el=document.getElementById("tms");if(el)el.textContent="描画 "+Math.round(performance.now()-t)+"ms／ピン "+S.houses.length;};
bar.onclick=e=>{const n=e.target.dataset&&e.target.dataset.n;if(n==null)return;const N=+n;
 if(!confirm(N?"テスト用に"+N+"件のダミーピンを作ります（この画面のテストデータだけ。本番とは別保存です）":"テストデータを全部消します"))return;
 S.houses=[];const names=S.res.filter(r=>!r[2]).map(r=>r[0]),fl=S.flags.filter(f=>f[3]=="visit").map(f=>f[0]);
 for(let i=0;i<N;i++){const v=[],k=1+i%3;for(let j=0;j<k;j++)v.push({t:Date.now()-j*864e5,r:names[(i+j)%names.length]});
  S.houses.push({id:"t"+i+"_"+Date.now(),lat:c.lat+((i%40)-20)*0.00018+(Math.random()-.5)*8e-5,lng:c.lng+(Math.floor(i/40)%40-20)*0.00022+(Math.random()-.5)*8e-5,visits:v,flags:fl.slice(0,i%4),memo:"テストメモ",survey:{},lay:["visit"]})}
 save();draw();toast(N?N+"件作りました。地図を動かしたり、拡大・縮小してみてください。":"消しました",4000)};
setTimeout(draw,50)})();
</script></body></html>
